name: Deploy to Amazon EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.8'

      - name: Build project
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Docker and Git on AWS (if missing)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            
            # Install git if missing
            if ! command -v git &> /dev/null
            then
              sudo dnf install -y git
            fi

            if ! command -v docker &> /dev/null
            then
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi
            
            # Determine architecture
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              ARCH="amd64"
            elif [ "$ARCH" = "aarch64" ]; then
              ARCH="arm64"
            fi

            # Check for docker compose plugin (standard in newer Amazon Linux 2023)
            if ! docker compose version &> /dev/null
            then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins/
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$ARCH -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Install/Update docker buildx plugin to v0.30.1
            BUILDX_VERSION="v0.30.1"
            if docker buildx version 2>/dev/null | grep -q "$BUILDX_VERSION"; then
              echo "Docker buildx $BUILDX_VERSION already installed."
            else
              sudo mkdir -p /usr/local/lib/docker/cli-plugins/
              sudo curl -SL "https://github.com/docker/buildx/releases/download/$BUILDX_VERSION/buildx-$BUILDX_VERSION.linux-$ARCH" -o /usr/local/lib/docker/cli-plugins/docker-buildx
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
            fi
          EOF

      - name: Clone and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/go-dutch"
            
            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            fi
            
            # Create .env file for Docker Compose
            echo "APP_GODUTCH_STAGE=production" > .env
            echo "APP_GODUTCH_DEBUG=false" >> .env
            echo "APP_GODUTCH_SERVERPORT=8080" >> .env
            echo "APP_GODUTCH_DBUSERNAME=postgres" >> .env
            echo "APP_GODUTCH_DBPASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "APP_GODUTCH_DBHOST=db" >> .env
            echo "APP_GODUTCH_DBPORT=5432" >> .env
            echo "APP_GODUTCH_DBDEFAULTNAME=godutch" >> .env
            echo "APP_GODUTCH_JWTSECRET=${{ secrets.JWT_SECRET }}" >> .env
            
            # Run docker compose
            docker compose up -d --build
            
            # Run migrations (assuming golang-migrate is available or run via docker)
            # For simplicity, we can use a temporary container to run migrations
            docker run --rm -v $(pwd)/migrations:/migrations --network go-dutch_default migrate/migrate \
              -path=/migrations/ \
              -database "postgres://postgres:${{ secrets.DB_PASSWORD }}@db:5432/godutch?sslmode=disable" up
            
            # Aggressive cleanup of unused Docker resources
            docker system prune -a -f --volumes
            docker builder prune -a -f
          EOF